<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Risiko Diabetes</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .diabetes-container {
            max-width: 700px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ccc;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn-hitung {
            width: 100%;
            padding: 13px;
            background: #168b83;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-hitung:hover {
            background: #106b65;
        }

        #hasil-diabetes {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background: #e5f5f0;
        }

        .btn-reset {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="diabetes-container">

    <h1>Kalkulator Risiko Diabetes</h1>

    <p>
        Masukkan data berikut untuk mendapatkan
        perkiraan faktor risiko diabetes tipe 2.
    </p>

    <form id="form-diabetes">

        <div class="form-group">
            <label>Usia (tahun)</label>
            <input type="number" id="usia"
                   placeholder="Contoh: 25" min="1" max="120"
                   required>
        </div>

        <div class="form-group">
            <label>Berat Badan (kg)</label>
            <input type="number" id="berat"
                   placeholder="Contoh: 65" min="1"
                   step="0.1" required>
        </div>

        <div class="form-group">
            <label>Tinggi Badan (cm)</label>
            <input type="number" id="tinggi"
                   placeholder="Contoh: 170" min="1"
                   step="0.1" required>
        </div>

        <div class="form-group">
            <label>Jenis Kelamin</label>
            <select id="gender" required>
                <option value="">Pilih jenis kelamin</option>
                <option value="pria">Laki-laki</option>
                <option value="wanita">Perempuan</option>
            </select>
        </div>

        <div class="form-group">
            <label>Lingkar Perut (cm)</label>
            <input type="number" id="lingkar"
                   placeholder="Contoh: 85" min="1"
                   step="0.1" required>
        </div>

        <div class="form-group">
            <label>Apakah keluarga memiliki riwayat diabetes?</label>
            <select id="keluarga" required>
                <option value="">Pilih jawaban</option>
                <option value="ya">Ya</option>
                <option value="tidak">Tidak</option>
            </select>
        </div>

        <div class="form-group">
            <label>Apakah kamu rutin melakukan aktivitas fisik?</label>
            <select id="aktivitas" required>
                <option value="">Pilih jawaban</option>
                <option value="ya">Ya</option>
                <option value="tidak">Tidak</option>
            </select>
        </div>

        <div class="form-group">
            <label>Apakah memiliki riwayat tekanan darah tinggi?</label>
            <select id="tekanan" required>
                <option value="">Pilih jawaban</option>
                <option value="ya">Ya</option>
                <option value="tidak">Tidak</option>
            </select>
        </div>

        <button type="submit" class="btn-hitung">
            Hitung Risiko Diabetes
        </button>

        <button type="reset" class="btn-reset">
            Reset Data
        </button>

    </form>

    <div id="hasil-diabetes" aria-live="polite"></div>

    <p style="font-size: 12px; color: #666;">
        Catatan: Hasil ini merupakan simulasi edukasi,
        bukan diagnosis medis.
    </p>

</div>

<script src="../js/risiko-diabetes.js"></script>

</body>
</html>
